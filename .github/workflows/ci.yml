name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: shellcheck + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2, Linux ships bash 5.x. The script must work on
        # both, so both are exercised: a bash 4+ builtin (mapfile) previously
        # broke every macOS user while Linux-only testing stayed green.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck jq

      - name: Report bash version
        run: bash --version

      - name: Lint
        run: shellcheck --shell=bash claude-statusline.sh claude-acct install.sh test/run.sh test/acct.sh

      - name: Test
        run: ./test/run.sh && ./test/acct.sh
